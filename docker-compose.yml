services:
  postgres:
    image: postgres:16
    container_name: spider_db
    environment:
      POSTGRES_DB: spider
      POSTGRES_USER: spider_user
      POSTGRES_PASSWORD: spider_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d  # Postgres init
    restart: unless-stopped

volumes:
  postgres_data:
