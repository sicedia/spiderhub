services:
  postgres:
    image: postgres:16-alpine
    container_name: "spider_db"
    environment:
      POSTGRES_DB: spider
      POSTGRES_USER: spider_user
      POSTGRES_PASSWORD: spider_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spider_user -d spider"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - spider_network
    security_opt:
      - no-new-privileges:true

  web:
    container_name: "spider_web"
    image: sicedia/spiderhub:0.1.0-rc.10
    env_file:
      - .env.production
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - spider_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/tmp:noexec,nosuid,size=100m
      - /app/locale:size=50m

  nginx:
    image: nginx:stable-alpine
    container_name: "spider_nginx"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - spider_network
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local
  logs_data:
    driver: local

networks:
  spider_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16 
