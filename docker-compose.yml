services:
  postgres:
    image: postgres:16
    container_name: spider_db
    environment:
      POSTGRES_DB: spider
      POSTGRES_USER: spider_user
      POSTGRES_PASSWORD: spider_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spider_user -d spider"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: spider_web
    env_file:
      - .env.production
    expose:
      - "8000"                 # sólo expone internamente
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    command: ["gunicorn", "--timeout", "60", "config.wsgi:application"]

  adminer:
    image: adminer:latest
    container_name: spider_adminer
    ports:
      - "8083:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB: spider
      ADMINER_DEFAULT_USER: spider_user
    depends_on:
      - postgres
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: spider_nginx
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro   # tus certificados SSL
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
