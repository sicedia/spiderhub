services:
  postgres:
    image: postgres:16
    container_name: spider_db
    environment:
      POSTGRES_DB: spider
      POSTGRES_USER: spider_user
      POSTGRES_PASSWORD: spider_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d  # Postgres init
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: spider_adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB: spider
      ADMINER_DEFAULT_USER: spider_user
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
