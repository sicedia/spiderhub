services:
  postgres:
    image: postgres:16
    container_name: spider_db
    environment:
      POSTGRES_DB: spider
      POSTGRES_USER: spider_user
      POSTGRES_PASSWORD: spider_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spider_user -d spider"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: spider_web
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://spider_user:spider_password@postgres:5432/spider
      - DJANGO_SECRET_KEY=your-secret-key-here
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - DJANGO_DEBUG=False
    ports:
      - "4321:8000"
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application"

  adminer:
    image: adminer:latest
    container_name: spider_adminer
    ports:
      - "8083:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB: spider
      ADMINER_DEFAULT_USER: spider_user
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
