services:
  postgres:
    image: postgres:16-alpine
    container_name: "spider_db"
    environment:
      POSTGRES_DB: spider
      POSTGRES_USER: spider_user
      POSTGRES_PASSWORD: spider_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spider_user -d spider"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - spider_network
    security_opt:
      - no-new-privileges:true
volumes:
  postgres_data:
    driver: local


networks:
  spider_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16 